<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="slider">
    <div class="slides">
        <div class="slide"><img src="istockphoto-517188688-612x612.jpg"></div>
        <div class="slide"><img src="istockphoto-1317323736-612x612.jpg"></div>
        <div class="slide"><img src="photo-masthead-375-BoK_p8LG.webp"></div>
        <div class="slide"><img src="scenic-image-iceland-incredible-nature-600nw-1453557041%20(1).webp"></div>
    </div>
    <div class="controls"></div>
</div>
<div class="buttons">
    <button id="prev" onclick="prev()">Предыдущее</button>
    <button id="next" onclick="next()">Следующее</button>
    <button id="first" onclick="first()">Первое</button>
    <button id="last" onclick="last()">Последнее</button>
    <button id="auto" onclick="auto()">Автопролистывание</button>
    <button id="stop" onclick="stop()">Стоп</button>
    <button id="toggle" onclick="toggle()">сворачивает</button>


</div>
<script>
    const slides = document.querySelectorAll(".slide");
    let index = 0;
    slides.forEach(slide => slide.style.display = "none");
    slides[0].style.display = "block";
    function showSlide(i) {
        slides.forEach(slide => slide.style.display = "none");
        slides[i].style.display = "block";
    }

    function next() {
        index+=1;
        if (index > 3) {
            index =0;
        }
        showSlide(index);
    }

    function prev() {
        index-=1;
        if (index < -1) {
            index=3;
        }
        showSlide(index);
    }

    function first() {
        index=0;
        showSlide(index);
    }

    function last() {
        index=3;
        showSlide(index);
    }

    let go=true;

    async function auto(){
        while (go){
            next();
            await sleep(2000);
        }
    }

    function stop(){
        go=false;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function toggle() {
        slides[index].firstElementChild.requestFullscreen();
    }

</script>
</body>
</html>
